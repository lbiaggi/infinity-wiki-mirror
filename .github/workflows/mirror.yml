name: Scheduled Infinity Wiki Mirror to GitHub Pages

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Environment Variables
      run: |
        echo "WIKI_URL=https://infinitythewiki.com/" >> $GITHUB_ENV
        echo "CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

    - name: Install httrack
      run: |
        sudo apt-get update && sudo apt-get install -y httrack


    - name: Download Mirror
      run: |
        httrack "${{ env.WIKI_URL }}" \
        -O "./scratchpad" \
        -w \
        -c4 \
        --robots=0 \
        --disable-security-limits \
        --max-rate=0 \
        "+*.html" "+*.css" "+*.js" "+*.png" "+*.jpg" "+*.gif" "+*.svg" "+*.webp" \
        "-*action=*" "-*title=Special:*" "-*title=Talk:*" "-*title=User:*" \
        "-*title=Category:*" "-*title=File:*" "-*diff=*" "-*oldid=*" \
        "-*printable=*" "-*limit=*" "-*dir=*" "-*redirect=*" \
        "-load.php*" "-api.php*" "-rest.php*" || EXIT_CODE=$?

        echo "completed with exit code: ${EXIT_CODE}"

        if [ "${EXIT_CODE}" -ne 0 ]; then
          echo "failed and I don't want to stop anyway, Error Code: ${EXIT_CODE}"
          exit 0
        fi

    - name: PageFind Search Indexer
      run: |
        # does it work? hope so.
        npx pagefind --site scratchpad/infinitythewiki.com

    - name: Inject Stuff
      run: |
        BANNER="<div style=\"background-color: #ffcc00; color: #000; text-align: center; padding: 12px; font-weight: bold; font-family: sans-serif; position: relative; display: block; clear: both; margin-top: 50px; width: 100%; border-bottom: 2px solid #e6b800; box-sizing: border-box;\"><b>NOTE:</b> This is an ARCHIVED MIRROR. Last updated: ${{ env.CURRENT_DATE }}. View live site at <a href=\"${{ env.WIKI_URL }}\" style=\"color: #0056b3; text-decoration: underline;\">${{ env.WIKI_URL }}</a></div>"

        SEARCH_ASSETS="<link href=\"/_pagefind/pagefind-ui.css\" rel=\"stylesheet\"><script src=\"/_pagefind/pagefind-ui.js\"></script><div id=\"search-results-overlay\" style=\"display:none; padding: 20px; max-width: 800px; margin: 20px auto; background: #fff; border: 1px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 4px;\"><button onclick=\"document.getElementById('search-results-overlay').style.display='none'\" style=\"float:right; cursor:pointer;\">✕ Close Results</button><div id=\"pagefind-search-target\"></div></div>"

        INTERCEPT_JS='<script>window.addEventListener("DOMContentLoaded", () => { const pf = new PagefindUI({ element: "#pagefind-search-target", showImages: false }); const mwForm = document.querySelector("form#searchform, form.mw-search-form"); const mwInput = document.querySelector("input[type=\"search\"], #searchInput"); if (mwForm && mwInput) { mwForm.addEventListener("submit", (e) => { e.preventDefault(); const query = mwInput.value.trim(); if (query) { document.getElementById("search-results-overlay").style.display = "block"; pf.triggerSearch(query); } }); } });</script>'

        find . -type f -name "*.html" -exec sed -i "s|<body[^>]*>|\&\n$BANNER|" {} +

        find . -type f -name "*.html" -exec sed -i "s|$BANNER|\&\n$SEARCH_ASSETS\n$INTERCEPT_JS|" {} +

    - name: Deploy mirror with gh-pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: scratchpad/infinitythewiki.com
        branch: gh-pages
